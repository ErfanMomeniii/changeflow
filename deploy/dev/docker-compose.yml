# Local MySQL configured for change data capture.
#
# Every flag below maps to a required preflight check. Notably
# binlog-row-metadata defaults to MINIMAL even on MySQL 8, which is why it is set
# explicitly: without FULL, unsigned columns arrive negative and ENUMs arrive as
# integers.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8}
    container_name: changeflow-mysql
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
      - --log-replica-updates=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    ports:
      - "13306:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The destination stores sit behind a profile so day-to-day work against MySQL
  # alone does not pay for pulling or running them:
  #   docker compose --profile sinks up -d --wait
  elasticsearch:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.0}
    container_name: changeflow-es
    profiles: ["sinks"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # A small heap is plenty for development and keeps the container from
      # claiming a multi-gigabyte default on a laptop.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ingest.geoip.downloader.enabled: "false"
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    container_name: changeflow-ch
    profiles: ["sinks"]
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: changeflow
      CLICKHOUSE_PASSWORD: changeflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
