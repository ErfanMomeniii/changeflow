name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # Fast feedback: everything that needs no services. This is the gate for the
  # majority of changes, and it has to stay quick enough to run on every push.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1 -race

      # Budgets are asserted as tests, so a regression fails the build rather than
      # sitting in output nobody reads. Allocation counts are the gate: they are a
      # property of the code, while nanoseconds on a shared runner are not comparable
      # between machines.
      - name: performance budgets
        run: go test ./internal/pipeline/ ./internal/sink/elasticsearch/ -count=1 -run 'Budget|Cheap' -v

      # Alert rules are shipped, so a rule that does not parse would be discovered when it
      # was needed rather than here.
      - name: alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.4.0 check rules /rules/alerts.yml

      # Recorded for whoever reads the run, not compared automatically.
      - name: benchmarks
        run: go test ./... -run XXX -bench . -benchmem -benchtime 200ms | grep -E '^(Benchmark|goos|goarch|pkg)' || true

  # The companion package application code uses. It reads changeflow's state and emits
  # its configuration, so a change on either side that breaks the other fails here.
  php:
    name: php package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, json
          tools: composer

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: install dependencies
        working-directory: sdk/php
        run: composer install --no-interaction --no-progress

      - name: test
        working-directory: sdk/php
        run: ./vendor/bin/phpunit

      # The point of the builder is that an application's own metadata produces a
      # configuration changeflow accepts. Asserting that here means a model change that
      # breaks the export fails the build rather than production.
      - name: generated configuration is valid
        env:
          # Any values will do: validate checks the file's shape and never connects.
          MYSQL_DSN: cdc:cdc@tcp(127.0.0.1:3306)/shop
          META_DSN: cdc:cdc@tcp(127.0.0.1:3306)/changeflow_meta
          ES_URL: http://127.0.0.1:9200
        run: |
          go build -o bin/changeflow ./cmd/changeflow
          php sdk/php/examples/export-config.php > /tmp/generated.yaml
          cat /tmp/generated.yaml
          ./bin/changeflow validate -c /tmp/generated.yaml

  # Tests that need a real MySQL: binlog decoding, information_schema reading, the
  # checkpoint store, and the advisory lock. These are the ones that keep finding
  # bugs a stub cannot.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Compose rather than a service container: MySQL needs command-line flags to
      # enable CDC, and binlog_row_metadata=FULL in particular, which service
      # containers cannot pass.
      - name: start mysql
        run: docker compose -f deploy/dev/docker-compose.yml up -d --wait mysql

      - name: run integration tests
        env:
          CHANGEFLOW_TEST_DSN: cdc:cdc@tcp(127.0.0.1:13306)/shop?parseTime=true
          CHANGEFLOW_TEST_META_DSN: cdc:cdc@tcp(127.0.0.1:13306)/changeflow_meta?parseTime=true
          CHANGEFLOW_TEST_WRITE_DSN: root:root@tcp(127.0.0.1:13306)/shop?parseTime=true
        run: go test ./... -count=1

      - name: mysql logs on failure
        if: failure()
        run: docker compose -f deploy/dev/docker-compose.yml logs mysql

      - name: stop services
        if: always()
        run: docker compose -f deploy/dev/docker-compose.yml --profile sinks down -v

  # The real thing: the compiled binary, a real MySQL, a real Elasticsearch, and a
  # process killed mid-batch to prove convergence.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHANGEFLOW_E2E: "1"
      CHANGEFLOW_E2E_MYSQL_DSN: root:root@tcp(127.0.0.1:13306)/shop
      CHANGEFLOW_E2E_META_DSN: root:root@tcp(127.0.0.1:13306)/changeflow_meta
      CHANGEFLOW_E2E_ES_URL: http://127.0.0.1:19200
      CHANGEFLOW_E2E_CH_DSN: http://changeflow:changeflow@127.0.0.1:18123/?database=analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: free disk space
        run: |
          # Elasticsearch's image is large, and the runner ships with tooling this
          # job does not need.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - name: raise vm.max_map_count for Elasticsearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sysctl vm.max_map_count

      - name: start mysql and elasticsearch
        run: docker compose -f deploy/dev/docker-compose.yml --profile sinks up -d --wait mysql elasticsearch

      - name: report service health
        run: |
          docker compose -f deploy/dev/docker-compose.yml ps
          curl -sf http://127.0.0.1:19200/_cluster/health | tee /dev/stderr
          curl -sf --data-binary "SELECT version()" \
            "http://changeflow:changeflow@127.0.0.1:18123/" | tee /dev/stderr

      # One step per scenario. A failed step name identifies the scenario in the run
      # summary, which is quicker to read than a log, and every step runs even after
      # an earlier failure so one run reports every problem rather than the first.
      - name: "e2e: insert reaches elasticsearch"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestInsertReachesElasticsearch

      - name: "e2e: update and delete propagate"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestUpdateAndDeletePropagate

      - name: "e2e: key change removes the old document"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestKeyChangeRemovesTheOldDocument

      - name: "e2e: one connection serves two streams"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestOneConnectionServesTwoStreams

      - name: "e2e: converges after an abrupt kill"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestConvergesAfterAnAbruptKill

      - name: "e2e: restart is idempotent"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestRestartIsIdempotent

      - name: "e2e: pre-existing rows are backfilled"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestPreexistingRowsAreBackfilled

      - name: "e2e: interrupted backfill resumes"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestInterruptedBackfillResumes

      - name: "e2e: a concurrent change wins over the scanned row"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestConcurrentChangeWinsOverTheScannedRow

      - name: "e2e: status reports progress"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestStatusReportsProgress

      - name: "e2e: refused document goes to the dead letter queue"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 5m -run TestRefusedDocumentGoesToTheDeadLetterQueueAndStreamContinues

      - name: "e2e: clickhouse receives inserts, updates, and deletes"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestClickHouseReceivesInsertsUpdatesAndDeletes

      - name: "e2e: clickhouse backfills pre-existing rows"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestClickHouseBackfillsPreexistingRows

      - name: "e2e: clickhouse converges after an abrupt kill"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestClickHouseConvergesAfterAnAbruptKill

      - name: "e2e: a snapshot restores the settings it relaxed"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 8m -run TestASnapshotRestoresTheSettingsItRelaxed

      - name: "e2e: an interrupted rebuild leaves readers on the old index"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 10m -run TestAnInterruptedRebuildLeavesReadersOnTheOldIndex

      - name: "e2e: a rebuild fills a new index and moves readers"
        if: ${{ !cancelled() }}
        run: go test ./test/e2e/ -count=1 -v -timeout 10m -run TestRebuildFillsANewIndexAndMovesReaders

      - name: service logs on failure
        if: failure()
        run: |
          echo "::group::mysql"
          docker compose -f deploy/dev/docker-compose.yml logs --tail 200 mysql
          echo "::endgroup::"
          echo "::group::elasticsearch"
          docker compose -f deploy/dev/docker-compose.yml logs --tail 300 elasticsearch
          echo "::endgroup::"
          echo "::group::clickhouse"
          docker compose -f deploy/dev/docker-compose.yml logs --tail 200 clickhouse
          echo "::endgroup::"

      - name: stop services
        if: always()
        run: docker compose -f deploy/dev/docker-compose.yml --profile sinks down -v
